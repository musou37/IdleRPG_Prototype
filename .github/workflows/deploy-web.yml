name: Deploy Web Build to GitHub Pages

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

env:
  GODOT_VERSION: "4.7.2"
  GODOT_RELEASE: "stable"

jobs:
  build-and-deploy:
    name: Build Godot 4.7.2 Web & Deploy
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Cache Godot 4.7.2 Binary & Export Templates
        id: cache-godot
        uses: actions/cache@v4
        with:
          path: |
            /tmp/godot-bin
            ~/.local/share/godot/export_templates/${{ env.GODOT_VERSION }}.${{ env.GODOT_RELEASE }}
          key: godot-${{ env.GODOT_VERSION }}-${{ env.GODOT_RELEASE }}-v1

      - name: Install Godot 4.7.2 & Web Export Templates
        if: steps.cache-godot.outputs.cache-hit != 'true'
        run: |
          mkdir -p /tmp/godot-bin
          mkdir -p ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}

          echo "Downloading Godot ${GODOT_VERSION}-${GODOT_RELEASE} Linux binary..."
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64.zip" -o /tmp/godot.zip
          unzip -q /tmp/godot.zip -d /tmp/godot-bin
          mv "/tmp/godot-bin/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_linux.x86_64" /tmp/godot-bin/godot
          chmod +x /tmp/godot-bin/godot

          echo "Downloading Godot ${GODOT_VERSION}-${GODOT_RELEASE} Export Templates..."
          curl -sSL "https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-${GODOT_RELEASE}/Godot_v${GODOT_VERSION}-${GODOT_RELEASE}_export_templates.tpz" -o /tmp/templates.tpz
          unzip -q /tmp/templates.tpz -d /tmp/templates
          mv /tmp/templates/templates/* ~/.local/share/godot/export_templates/${GODOT_VERSION}.${GODOT_RELEASE}/
          rm -rf /tmp/godot.zip /tmp/templates.tpz /tmp/templates

      - name: Ensure Godot executable permissions
        run: chmod +x /tmp/godot-bin/godot

      - name: Import project assets & build Web export
        run: |
          mkdir -p build/web
          /tmp/godot-bin/godot --headless --editor --quit --path "$GITHUB_WORKSPACE"
          /tmp/godot-bin/godot --headless --export-release "Web" "build/web/index.html" --path "$GITHUB_WORKSPACE"
          touch build/web/.nojekyll
          ls -lh build/web

      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./build/web
          force_orphan: true

      - name: Upload Pages artifact (for GitHub Actions Pages source)
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./build/web

      - name: Deploy to GitHub Pages (if Actions source is enabled)
        uses: actions/deploy-pages@v4
        continue-on-error: true
